/* Scan actions belong to the home content, rather than the window footer. */
.app-window.home-view{grid-template-rows:44px minmax(0,1fr)}

.titlebar{grid-template-columns:auto minmax(0,1fr) auto}
.window-title{justify-self:start}
.window-tools{align-items:center;min-width:0}
.window-scope-count{display:block;padding:0 var(--s1);border:1px solid var(--line);border-radius:4px;background:var(--surface3);color:var(--green);font:10px/20px var(--mono);white-space:nowrap}
.ai-inline-entry{display:flex;align-items:center;gap:var(--s3);padding:var(--s4);background:var(--surface2);border:1px solid var(--line);border-radius:var(--r)}
.ai-results-entry{margin:0 var(--s8) var(--s4)}
.ai-entry-title{display:flex;align-items:center;flex-wrap:wrap;gap:var(--s2)}
.ai-entry-title strong{font-size:13px;font-weight:500}
.ai-inline-entry small{display:block;font-size:11px;line-height:1.8;color:var(--muted);overflow-wrap:anywhere}
.ai-inline-entry .btn{flex:none;font-size:12px}
.ai-entry-actions{display:flex;align-items:center;gap:var(--s3);flex-wrap:wrap;justify-content:flex-end}
.ai-entry-actions .text-button{font-size:11px}
.ai-file-entry{margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);flex-wrap:wrap}
.ai-file-entry strong{display:block;font-size:12px;font-weight:500}
.ai-file-entry small{display:block;color:var(--muted);font-size:11px}
.ai-file-entry .btn{font-size:12px}
.settings-tabs{display:flex;gap:var(--s4);border-bottom:1px solid var(--line);margin-top:var(--s5)}
.settings-tab{display:block;min-height:44px;padding:var(--s2) var(--s1);border-bottom:2px solid transparent;background:transparent;color:var(--muted);font-size:13px}
.settings-tab[aria-selected=true]{color:var(--green);border-bottom-color:var(--green)}
.settings-panel{padding-top:var(--s5)}
.ai-demo-note{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s3);font-size:11px;line-height:1.8;color:var(--muted)}
.ai-demo-note .od-icon{--od-icon-size:14px;margin-top:3px}
.ai-pending-note{margin-top:var(--s4);padding:var(--s3);background:var(--soft);border:1px solid var(--soft-border);border-radius:var(--r);color:var(--soft-text);font-size:12px;line-height:1.8}
.provider-layout{display:grid;grid-template-columns:172px minmax(0,1fr);gap:var(--s6);margin-top:var(--s5)}
.provider-label{font-size:11px;color:var(--muted);margin-bottom:var(--s2)}
.provider-list{display:grid;gap:var(--s1)}
.provider-choice{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);text-align:left;min-width:0;min-height:56px;padding:var(--s2) var(--s3);border:1px solid transparent;border-radius:var(--r);background:transparent;color:var(--text)}
.provider-choice strong{display:block;font-size:13px;font-weight:500;overflow-wrap:anywhere}
.provider-choice small{display:block;font-size:10px;color:var(--muted);line-height:1.8}
.provider-choice[aria-pressed=true]{background:var(--soft);border-color:var(--soft-border)}
.provider-choice>.od-icon{--od-icon-size:14px;color:var(--green)}
.provider-heading{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4)}
.provider-heading h3{font-size:16px}
.provider-form{min-width:0}
.provider-form-fields{display:grid;gap:var(--s4)}
.llm-field{display:grid;gap:var(--s2);min-width:0;font-size:13px}
.llm-field>span{display:block}
.llm-field input{display:block;min-width:0;width:100%;min-height:44px;border:1px solid var(--line-strong);border-radius:var(--r);padding:var(--s2) var(--s3);background:var(--input);color:var(--text);font-size:14px;line-height:1.6}
.llm-field input[aria-invalid=true]{border-color:var(--red)}
.llm-field .llm-hint{font-size:11px;line-height:1.8;color:var(--muted)}
.llm-field .llm-hint a{color:var(--green);text-underline-offset:3px}

.ai-key-control input{border:0;flex:1;background:transparent}
.ai-key-toggle{display:flex;align-items:center;justify-content:center;min-height:44px;min-width:44px;padding:var(--s2);background:transparent;color:var(--green);font-size:12px;border-radius:var(--r)}
.ai-field-error{display:block;color:var(--red);font-size:12px;line-height:1.8}

.ai-default-choice strong{display:block;font-size:12px;font-weight:500}
.ai-default-choice small{display:block;font-size:11px;color:var(--muted)}
.ai-test-result{display:grid;gap:var(--s1);margin-top:var(--s4);padding:var(--s3);border:1px solid var(--line);border-radius:var(--r);background:var(--surface);font-size:12px}
.ai-test-result>span{display:block}
.ai-test-result small{display:block;font-size:11px;color:var(--muted);line-height:1.8}
.ai-test-result[data-state=passed]>span{color:var(--green)}
.ai-test-result[data-state=failed]>span{color:var(--red)}
.ai-test-result[data-state=testing]{border-color:var(--soft-border)}
.ai-form-actions{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:var(--s2);margin-top:var(--s4)}
.ai-form-actions .btn{min-height:40px;font-size:12px}
.ai-save-note{font-size:11px!important;margin-top:var(--s3)!important;line-height:1.8!important}
.ai-save-note.is-saved{color:var(--green)}
.ai-settings-foot{display:flex;align-items:flex-start;gap:var(--s2);margin-top:var(--s5);padding-top:var(--s4);border-top:1px solid var(--line);font-size:11px;color:var(--muted);line-height:1.9}
.ai-settings-foot .od-icon{--od-icon-size:14px;margin-top:3px}
.ai-advice-dialog{width:min(664px,calc(100vw - 32px))}
.ai-advice-source{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center;margin-top:var(--s4);font-size:12px;overflow-wrap:anywhere}
.ai-context-preview{margin-top:var(--s4);padding:var(--s3) var(--s4);border:1px solid var(--line);border-radius:var(--r);font-size:12px}
.ai-context-preview summary{cursor:pointer;color:var(--muted)}
.ai-context-preview p{font-size:11px;margin-top:var(--s2);overflow-wrap:anywhere}
.ai-answer{margin-top:var(--s5)}
.ai-answer>p{font-size:13px;line-height:1.9}
.ai-answer-empty{display:grid;gap:var(--s2);padding:var(--s5) 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.ai-answer-empty strong{font-size:14px;font-weight:500}
.ai-answer-empty small{display:block;font-size:12px;line-height:1.9;color:var(--muted)}
.ai-answer-section{padding:var(--s4) 0;border-bottom:1px solid var(--line)}
.ai-answer-section h3{font-size:14px;line-height:1.8}
.ai-answer-section p{font-size:12px;line-height:1.9;margin-top:var(--s2);color:var(--text)}
.ai-answer-section small{display:block;font-size:11px;line-height:1.9;margin-top:var(--s2);color:var(--muted)}
.ai-advice-footer{display:flex;justify-content:space-between;align-items:center;gap:var(--s3);flex-wrap:wrap;margin-top:var(--s5)}
.ai-advice-footer .actions{justify-content:flex-end}
.ai-advice-footer .btn{font-size:12px}

function setSettingsTab(tab,focus=true){
 if(!['ai','appearance'].includes(tab))return;
 captureAIDraft();
 $$('[data-settings-tab]').forEach(b=>{const selected=b.dataset.settingsTab===tab;b.setAttribute('aria-selected',String(selected));b.tabIndex=selected?0:-1});
 $('#settings-panel-ai').hidden=tab!=='ai';$('#settings-panel-appearance').hidden=tab!=='appearance';
 if(focus)$('#settings-tab-'+tab)?.focus();
}
function captureAIDraft(){
 const root=$('#provider-form .provider-form-fields');if(!root||root.dataset.provider!==aiSelectedProvider)return;
 const d=aiDrafts[aiSelectedProvider],next={key:$('#llm-key').value,model:$('#llm-model').value,endpoint:$('#llm-endpoint').value};
 const changed=['key','model','endpoint'].some(k=>d[k]!==next[k]);
 if(changed){cancelAIWork();Object.assign(d,next);d.testStatus='idle';d.testFingerprint=null;d.saved=false}
 d.asDefault=$('#llm-as-default')?.checked||false;
}
function selectAIProvider(id){
 if(!llmProviders.some(p=>p.id===id))return;
 captureAIDraft();cancelAIWork();aiSelectedProvider=id;$('#provider-select').innerHTML=providerChoicesMarkup();$('#provider-form').innerHTML=providerFormMarkup();renderAIStatus();$('#provider-select')?.focus();
}
function aiValidationErrors(){
 const p=aiProvider(aiSelectedProvider),d=aiDrafts[p.id],errors={};
 if(p.keyRequired&&!d.key.trim())errors.key='请填写此供应商的 API Key。';
 if(!d.model.trim())errors.model='请填写供应商提供的模型 ID。';
 else if(/\s/.test(d.model.trim()))errors.model='模型 ID 不能包含空格，请核对供应商给出的名称。';
 try{const u=new URL(d.endpoint.trim());if(!['http:','https:'].includes(u.protocol)||!u.hostname)throw new Error('invalid');if(u.username||u.password)errors.endpoint='请在 API Key 中填写凭证，接口地址只保留基础地址。';else if(u.search||u.hash)errors.endpoint='基础地址无需查询参数或 # 片段，请移除后再试。'}catch{errors.endpoint='请输入完整的 http:// 或 https:// 基础地址。'}
 return errors;
}
function showAIFieldError(field,message){
 const input=$('#llm-'+field),error=$('#llm-'+field+'-error');if(!input||!error)return;
 error.textContent=message||'';error.hidden=!message;input.setAttribute('aria-invalid',String(Boolean(message)));
}
function updateAIErrorSummary(){
 const summary=$('#ai-error-summary');if(!summary)return;
 const fields=['key','model','endpoint'].filter(field=>$('#llm-'+field)?.getAttribute('aria-invalid')==='true');
 summary.hidden=!fields.length;
 if(fields.length)summary.innerHTML=`请检查 ${fields.length} 处配置${fields.map(field=>`<button type="button" class="text-button" data-ai-error-field="${field}">${({key:'API Key',model:'默认模型',endpoint:'接口地址'})[field]}</button>`).join('')}`;
}
function validateAIForm(){
 const errors=aiValidationErrors();['key','model','endpoint'].forEach(field=>showAIFieldError(field,errors[field]));updateAIErrorSummary();
 const first=Object.keys(errors)[0];if(first)$('#llm-'+first)?.focus();return !first;
}
function renderAIStatus(){
 const box=$('#ai-test-result');if(!box)return;
 const d=aiDrafts[aiSelectedProvider],status=d.testStatus;
 box.dataset.state=status;
 const copy={idle:['尚未测试','测试仅演示配置检查，不会发送网络请求。'],testing:['正在演示连接检查…','正在检查字段格式，未联系真实供应商。'],passed:['配置格式检查通过','演示结果：真实连接、密钥权限与模型可用性尚未验证。'],failed:['配置检查未通过','请按字段提示补全或修改，再重新测试。']}[status]||['尚未测试',''];
 box.innerHTML=`<span>${status==='passed'?icon('check')+' ':''}${copy[0]}</span><small>${copy[1]}</small>`;
 $('#provider-form')?.setAttribute('aria-busy',String(status==='testing'));
 const test=$('[data-act="ai-test"]'),save=$('[data-act="ai-save"]');
 if(test){test.disabled=status==='testing';test.textContent=status==='testing'?'演示测试中…':'测试连接'}if(save)save.disabled=status==='testing';
 const note=$('#ai-save-note');if(note){note.classList.toggle('is-saved',d.saved);note.textContent=d.saved?'配置已保存，仅在本次会话中生效。':AI.configs[aiSelectedProvider]?'修改后需重新保存；配置仅在本次会话生效。':'填写后保存配置，首次保存会开启 AI 辅助建议。'}
}
function testAIConnection(){
 captureAIDraft();cancelAIWork();const d=aiDrafts[aiSelectedProvider];
 if(!validateAIForm()){d.testStatus='failed';renderAIStatus();return}
 d.testStatus='testing';renderAIStatus();
 const id=aiSelectedProvider,fingerprint=aiSignature(d),version=++aiWorkVersion;
 aiBusyTimer=setTimeout(()=>{if(version!==aiWorkVersion||id!==aiSelectedProvider||!$('#modal').open)return;d.testStatus='passed';d.testFingerprint=fingerprint;aiBusyTimer=null;renderAIStatus()},700);
}
function saveAIProvider(){
 captureAIDraft();const d=aiDrafts[aiSelectedProvider];if(d.testStatus==='testing')return;
 if(!validateAIForm()){d.testStatus='failed';renderAIStatus();return}
 const hadDefault=Boolean(AI.defaultId);
 AI.configs[aiSelectedProvider]={id:aiSelectedProvider,key:d.key.trim(),model:d.model.trim(),endpoint:d.endpoint.trim().replace(/\/+$/,''),formatChecked:d.testStatus==='passed'&&d.testFingerprint===aiSignature(d)};
 if(d.asDefault||!AI.defaultId)AI.defaultId=aiSelectedProvider;
 if(!hadDefault)AI.enabled=true;
 Object.values(aiDrafts).forEach((draft,index)=>draft.asDefault=llmProviders[index].id===AI.defaultId);
 d.saved=true;refreshAIEntrypoints();closeModal();toast('供应商配置已保存 · 本次会话有效');
}
function confirmRemoveAIProvider(){
 const id=aiSelectedProvider;if(!AI.configs[id])return;
 cancelAIWork();delete AI.configs[id];
 if(AI.defaultId===id)AI.defaultId=llmProviders.find(p=>AI.configs[p.id])?.id||null;
 if(!AI.defaultId)AI.enabled=false;
 const p=aiProvider(id);aiDrafts[id]={endpoint:p.endpoint,model:p.model,key:'',asDefault:!AI.defaultId,testStatus:'idle',testFingerprint:null,saved:false};
 Object.entries(aiDrafts).forEach(([key,d])=>d.asDefault=!AI.defaultId||key===AI.defaultId);
 $('#provider-select').innerHTML=providerChoicesMarkup();$('#provider-form').innerHTML=providerFormMarkup();refreshAIEntrypoints();renderAIStatus();$('#provider-select')?.focus();toast('供应商配置与本次会话密钥已移除');
}
function toggleAIKey(){const input=$('#llm-key'),b=$('[data-act="ai-toggle-key"]');if(!input||!b)return;const show=input.type==='password';input.type=show?'text':'password';b.textContent=show?'隐藏':'显示';b.setAttribute('aria-label',show?'隐藏 API Key':'显示 API Key');b.setAttribute('aria-pressed',String(show))}
function requestAIAdvice(fileId=null){

function aiContextFiles(context){return context.kind==='file'?files.filter(f=>f.id===context.fileId&&!f.removed):available()}
function aiContextText(context){
 if(context.kind==='before-scan')return '本次已选检查范围：'+[...S.scope].map(scopeName).join('、')+'。当前尚无扫描结果。';
 return aiContextFiles(context).map(f=>`${appOf(f).name} · ${f.name} · ${fmt(f.size)} GB · ${f.advice} · ${f.ready?'可审阅':'待条件满足'}`).join('；')||'当前没有可供分析的扫描项目。';
}
function showAIAdvice(context){
 const c=defaultAIConfig(),ready=aiReady();
 aiAdviceContext={...context};
 const subject=context.kind==='file'?files.find(f=>f.id===context.fileId):null;
 const title=subject?`${appOf(subject).name} · ${subject.name}`:context.kind==='before-scan'?'扫描前建议':'扫描结果建议';
 const source=ready?`<div class="ai-advice-source"><span class="badge good">演示回答</span><span>${esc(aiProvider(c.id).name)} · ${esc(c.model)}</span></div>`:'';
 const empty=ready?'<small>生成用途与处理影响的示例说明，不调用真实模型，不更改勾选项。</small>':'<strong>尚未配置供应商</strong><small>请先关闭此弹窗，在顶部“设置 → 供应商配置”中完成配置。</small>';
 openModal(dialogHead('询问 AI')+`<div class="ai-advice-scroll">${source}<p>${esc(title)}</p><details class="ai-context-preview"><summary>分析上下文</summary><p>${esc(aiContextText(context))}</p><p>仅使用类别摘要，不含文件内容、完整路径或密钥。</p></details><div class="ai-answer" id="ai-answer" aria-live="polite"><div class="ai-answer-empty">${empty}</div></div><div class="ai-advice-footer"><div class="actions">${btn('关闭','close-modal')}${ready?btn('生成示例建议','ai-generate','primary','spark'):''}</div></div></div>`,'ai-advice-dialog');
 ($('#modal [data-act="ai-generate"]')||$('#modal [data-act="close-modal"]'))?.focus();
}
function aiAnswerSection(title,text,extra=''){return `<section class="ai-answer-section"><h3>${esc(title)}</h3><p>${esc(text)}</p>${extra?`<small>${esc(extra)}</small>`:''}</section>`}
function aiAnswerMarkup(context){
 if(context.kind==='before-scan')return aiAnswerSection('推荐检查范围','缓存、浏览器资源、过期日志和构建缓存。扫描不修改文件。')+aiAnswerSection('默认保留','聊天资料、下载文件、应用偏好与离线模型。可通过顶部“检查范围”调整。')+aiAnswerSection('建议内容','解释文件用途、处理影响与依赖条件。','以上为演示规则摘要，不是真实模型输出。');
 const list=aiContextFiles(context);
 if(!list.length)return aiAnswerSection('当前没有可分析项目','请先完成扫描，或返回结果查看尚未处理的内容。');
 if(context.kind==='file'){const f=list[0];return aiAnswerSection(`${f.advice} · ${appOf(f).name}`,f.reason)+aiAnswerSection('处理影响',f.impact)+aiAnswerSection('处理条件',f.ready?'核对所属应用与备份后，可先隔离。同盘隔离仍占空间。':'仍有引用或功能依赖，需通过所属应用核查后再处理。','示例建议不更改勾选项，执行仍需确认。')}
 const clean=list.filter(f=>f.ready&&f.advice==='建议清理'),keep=list.filter(f=>f.type==='data'),pending=list.filter(f=>!f.ready);
 const names=a=>a.map(f=>appOf(f).name+' · '+f.name).join('、');
 return aiAnswerSection(`可优先审阅 · ${clean.length} 项`,clean.length?`${names(clean)}。涉及 ${fmt(sum(clean))} GB 文件占用，建议逐项核对可重建条件后再处理。`:'当前范围没有适合优先审阅的推荐清理项。')+aiAnswerSection(`继续保留 · ${keep.length} 项`,keep.length?`${names(keep)}。这些内容涉及个人资料或功能用途，先确认保留需求、备份与恢复方式。`:'本次范围未发现用户资料类别；仍需查看每项内容的具体影响。')+aiAnswerSection(`待条件满足 · ${pending.length} 项`,pending.length?`${names(pending)}。先解除引用或通过所属应用核查，当前不执行。`:'当前演示结果没有待条件满足的项目。','以上是演示规则摘要。保持原有勾选，同盘隔离不计作已释放空间。');
}

 cancelAIWork();const version=++aiWorkVersion,output=$('#ai-answer'),button=$('[data-act="ai-generate"]');
 output.setAttribute('aria-busy','true');output.innerHTML='<div class="ai-answer-empty"><strong>正在生成示例…</strong><small>不调用真实模型。</small></div>';button.disabled=true;button.textContent='正在生成示例…';

document.addEventListener('change',e=>{if(e.target.id==='llm-as-default'){captureAIDraft();aiDrafts[aiSelectedProvider].saved=false;renderAIStatus()}if(e.target.id==='provider-select')selectAIProvider(e.target.value)});
document.addEventListener('pointerdown',e=>{if(!$('#status-panel').hidden&&!$('#status-panel').contains(e.target)&&!$('#status-trigger').contains(e.target)){const shouldRestore=document.activeElement&&$('#status-panel').contains(document.activeElement);$('#status-panel').hidden=true;$('#status-trigger').setAttribute('aria-expanded','false');if(shouldRestore)$('#status-trigger').focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#status-panel').hidden){e.preventDefault();toggleQuick(false)}if(e.key==='Tab'&&!$('#status-panel').hidden){const focusables=$$('#status-panel button:not(:disabled),#status-panel input:not(:disabled)');const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}if((e.metaKey||e.ctrlKey)&&e.key==='1'&&!$('#modal').open){e.preventDefault();actions.work()}if((e.metaKey||e.ctrlKey)&&e.key==='2'&&!$('#modal').open){e.preventDefault();navigate('vault')}if((e.metaKey||e.ctrlKey)&&e.key==='3'&&!$('#modal').open){e.preventDefault();navigate('history')}});
document.addEventListener('keydown',e=>{
 if(e.target.dataset.settingsTab&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const tabs=['ai','appearance'];const index=tabs.indexOf(e.target.dataset.settingsTab);setSettingsTab(e.key==='Home'?tabs[0]:e.key==='End'?tabs[1]:tabs[(index+1)%2]);return}
 if(e.target.dataset.aiProvider&&['ArrowUp','ArrowDown'].includes(e.key)){e.preventDefault();const index=llmProviders.findIndex(p=>p.id===e.target.dataset.aiProvider);selectAIProvider(llmProviders[(index+(e.key==='ArrowDown'?1:llmProviders.length-1))%llmProviders.length].id);return}
 if(e.key==='Enter'&&e.target.dataset.aiField&&!e.isComposing){e.preventDefault();saveAIProvider()}
});
window.addEventListener('resize',syncWindowSurfaces,{passive:true});
window.addEventListener('scroll',syncWindowSurfaces,{passive:true});
if(typeof ResizeObserver!=='undefined')new ResizeObserver(syncWindowSurfaces).observe($('.app-window'));
$('#modal').addEventListener('cancel',e=>{e.preventDefault();closeModal()});
$('#modal').addEventListener('click',e=>{const modal=e.currentTarget;if(e.target!==modal||!modal.matches('.app-settings-dialog,.ai-advice-dialog'))return;const bounds=modal.getBoundingClientRect();if(e.clientX<bounds.left||e.clientX>bounds.right||e.clientY<bounds.top||e.clientY>bounds.bottom)closeModal()});
$('#system-clock').textContent=new Date().toLocaleString('zh-CN',{month:'short',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false});
document.addEventListener('change',e=>{if(e.target.dataset.settingScope)updateConfigCount()});
updateScopeSummary();
applyTheme(activeTheme);
refreshAIEntrypoints();
syncWindowSurfaces();
/* First screen is real HTML above. Initialization only binds interactions. */
})();
</script>
</body>
